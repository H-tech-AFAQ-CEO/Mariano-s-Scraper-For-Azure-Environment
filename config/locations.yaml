# One entry per store. Add a location = add a block here (no code change).
locations:
  - id: chicago-roosevelt          # EXAMPLE - replace with the assigned store
    enabled: true
    zipcode: "60607"
    store_id: ""                   # Kroger-family location id, if known (used for cookie verification)
    store_details_url: ""          # e.g. https://www.marianos.com/stores/details/<division>/<store-number>
    store_name: ""                 # fallbacks used only when the page banner does not expose them
    store_location: ""
    store_logo: ""
    banner_must_contain: []        # ALL must appear in the header store banner, e.g. ["Roosevelt"]. REQUIRED before production use.
    canaries: []                   # optional fixed canary product URLs (the scraper also auto-derives canaries from the last good run)
